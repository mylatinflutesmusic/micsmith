name: Build K Channel macOS VST3 (10.13)

on:
  push:
    paths:
      - "KChannel/**"
      - "Quell/Source/**"
      - ".github/workflows/build-kchannel-macos.yml"
  pull_request:
    paths:
      - "KChannel/**"
      - "Quell/Source/**"
      - ".github/workflows/build-kchannel-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: K Channel VST3 (x86_64, macOS 10.13)
    # Intel is required for a native x86_64 build that High Sierra can run.
    runs-on: macos-15-intel
    timeout-minutes: 30

    env:
      JUCE_VERSION: 8.0.6
      KCHANNEL_LD_CLASSIC: "ON"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch JUCE ${{ env.JUCE_VERSION }}
        run: |
          if [ ! -d JUCE ]; then
            git clone --depth 1 --branch "${JUCE_VERSION}" \
              https://github.com/juce-framework/JUCE.git JUCE
          fi
          test -f JUCE/CMakeLists.txt

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          cmake --version | head -1
          uname -m

      - name: Build and package VST3
        run: |
          chmod +x KChannel/build-macos.sh
          ./KChannel/build-macos.sh Release

      - name: Verify deployment target and architecture
        run: |
          VST3="KChannel/build-mac/KChannel_artefacts/Release/VST3/K Channel.vst3"
          BINARY="$VST3/Contents/MacOS/K Channel"
          test -f "$BINARY"
          echo "== lipo"
          lipo -info "$BINARY"
          echo "== build version"
          vtool -show-build "$BINARY" 2>/dev/null || otool -l "$BINARY" | grep -A4 LC_BUILD_VERSION

      - name: DSP tests
        run: |
          TEST_BIN="$(find KChannel/build-mac -type f -name KChannelDSPTest | head -n 1)"
          test -x "$TEST_BIN"
          "$TEST_BIN"

      - name: Host-load the packaged VST3
        run: |
          SMOKE_ROOT="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          SMOKE_DIR="$(mktemp -d "$SMOKE_ROOT/kchannel-host-smoke.XXXXXX")"
          trap 'rm -rf "$SMOKE_DIR"' EXIT

          ditto -x -k \
            "KChannel/dist/KChannel-VST3-macOS10.13-x86_64.zip" \
            "$SMOKE_DIR"
          test -d "$SMOKE_DIR/K Channel.vst3"

          cmake --build KChannel/build-mac \
            --parallel "$(sysctl -n hw.ncpu)" \
            --target KChannelHostTest

          HOST_BIN="$(find KChannel/build-mac -type f -name KChannelHostTest | head -n 1)"
          test -x "$HOST_BIN"
          "$HOST_BIN" "$SMOKE_DIR/K Channel.vst3"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: KChannel-VST3-macOS10.13-x86_64
          path: KChannel/dist/KChannel-VST3-macOS10.13-x86_64.zip
          if-no-files-found: error
          retention-days: 30
