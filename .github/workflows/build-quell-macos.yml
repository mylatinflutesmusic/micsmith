name: Build Quell macOS VST3 (10.13)

on:
  push:
    paths:
      - "Quell/**"
      - ".github/workflows/build-quell-macos.yml"
  pull_request:
    paths:
      - "Quell/**"
      - ".github/workflows/build-quell-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Quell VST3 (x86_64, macOS 10.13)
    # Intel is required for a native x86_64 build that High Sierra can run.
    runs-on: macos-15-intel

    env:
      JUCE_VERSION: 8.0.6

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch JUCE ${{ env.JUCE_VERSION }}
        run: |
          if [ ! -d JUCE ]; then
            git clone --depth 1 --branch "${JUCE_VERSION}" \
              https://github.com/juce-framework/JUCE.git JUCE
          fi
          test -f JUCE/CMakeLists.txt

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          cmake --version | head -1
          uname -m

      - name: Build and package VST3
        run: |
          chmod +x Quell/build-macos.sh
          ./Quell/build-macos.sh Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Quell-VST3-macOS10.13-x86_64
          path: Quell/dist/Quell-VST3-macOS10.13-x86_64.zip
          if-no-files-found: error
          retention-days: 30
